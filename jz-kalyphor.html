<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0C3460" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/favicon.png" />
  <meta name="description" content="JZ KALYPHOR, votre espace pédagogique pour prendre le contrôle de votre avenir professionnel." />
  <title>JZ KALYPHOR | Espace pédagogique</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.9/babel.min.js"></script>
  <style>:root {
  font-family: "Inter", Arial, sans-serif;
  color: #17324b;
  background: #f5f3ef;
  font-synthesis: none;
  text-rendering: optimizeLegibility;
  -webkit-font-smoothing: antialiased;
  --navy: #0c3460;
  --navy-dark: #07213e;
  --gold: #c49b4b;
  --gold-light: #e6c280;
  --ink: #17324b;
  --muted: #77869a;
  --line: #e2e8f0;
  --paper: #f5f3ef;
}

* {
  box-sizing: border-box;
}
html {
  scroll-behavior: smooth;
}
body {
  min-width: 320px;
  margin: 0;
}
button,
input,
textarea,
select {
  font: inherit;
}
button {
  cursor: pointer;
}
button:disabled {
  cursor: not-allowed;
  opacity: 0.55;
}
a {
  text-decoration: none;
}
button:focus-visible,
a:focus-visible,
input:focus-visible,
textarea:focus-visible,
select:focus-visible {
  outline: 3px solid rgba(196, 155, 75, 0.58);
  outline-offset: 3px;
}
::selection {
  background: #e6c280;
  color: #07213e;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}
.icon-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 0;
  background: transparent;
  color: inherit;
  flex: none;
  transition:
    color 0.2s ease,
    background 0.2s ease,
    transform 0.2s ease;
}
.icon-button:hover {
  transform: translateY(-1px);
}
.button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  min-height: 43px;
  padding: 0 19px;
  border: 1px solid transparent;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 700;
  white-space: nowrap;
  transition:
    background 0.22s ease,
    color 0.22s ease,
    border-color 0.22s ease,
    transform 0.22s ease,
    box-shadow 0.22s ease;
}
.button:not(:disabled):hover {
  transform: translateY(-2px);
}
.button-primary {
  background: var(--navy);
  color: #fff;
  box-shadow: 0 5px 13px rgba(12, 52, 96, 0.13);
}
.button-primary:hover {
  background: var(--navy-dark);
  box-shadow: 0 9px 19px rgba(12, 52, 96, 0.19);
}
.button-secondary {
  background: #fff;
  color: var(--navy);
  border-color: #dce3e9;
}
.button-secondary:hover {
  background: #f5f7fa;
  border-color: #bccbd8;
}
.button-gold {
  color: #102f4e;
  background: linear-gradient(135deg, #f0d69c, #c49b4b);
  box-shadow: 0 8px 24px rgba(196, 155, 75, 0.22);
}
.button-gold:hover {
  box-shadow: 0 11px 27px rgba(196, 155, 75, 0.34);
}
.button-danger {
  background: #b34242;
  color: #fff;
}
.button-danger:hover {
  background: #962d2d;
}
.section-eyebrow,
.panel-kicker,
.form-eyebrow {
  display: block;
  color: var(--gold);
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.16em;
  line-height: 1.45;
}
.surface {
  background: #fff;
  border: 1px solid #e7e9ec;
  border-radius: 14px;
  box-shadow: 0 4px 18px rgba(17, 48, 78, 0.035);
}

/* Branded sign-in */
.login-layout {
  display: grid;
  grid-template-columns: minmax(0, 1.07fr) minmax(470px, 0.93fr);
  min-height: 100vh;
  min-height: 100svh;
}
.login-story {
  position: relative;
  overflow: hidden;
  isolation: isolate;
  background: radial-gradient(
    circle at 92% 45%,
    #1a4a76 0,
    #103b68 28%,
    #0c3460 52%,
    #07213e 100%
  );
  color: #fff;
}
.login-story::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  opacity: 0.23;
  background-image:
    linear-gradient(rgba(230, 194, 128, 0.17) 1px, transparent 1px),
    linear-gradient(90deg, rgba(230, 194, 128, 0.17) 1px, transparent 1px);
  background-size: 91px 91px;
  mask-image: linear-gradient(105deg, transparent 3%, #000 100%);
}
.login-story::after {
  content: "";
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 6px;
  background: linear-gradient(#e6c280, #a3742b 58%, #e6c280);
}
.login-story-inner {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  min-height: 100svh;
  padding: 44px clamp(45px, 6.2vw, 104px) 40px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 11px;
  color: var(--navy);
  min-width: 0;
}
.brand-mark {
  flex: none;
  filter: drop-shadow(0 5px 6px rgba(5, 24, 43, 0.14));
}
.brand-copy {
  min-width: 0;
}
.brand-name {
  font-family: "Montserrat", sans-serif;
  font-weight: 800;
  font-size: 15px;
  white-space: nowrap;
  letter-spacing: 0.075em;
  line-height: 1.25;
}
.brand-name span {
  color: var(--gold);
}
.brand-motto {
  max-width: 190px;
  margin-top: 3px;
  color: #75869a;
  font-size: 9px;
  font-weight: 500;
  line-height: 1.35;
  letter-spacing: 0.004em;
}
.brand-light {
  color: #fff;
}
.brand-light .brand-motto {
  color: #b0bfd1;
}
.brand-large {
  gap: 14px;
}
.brand-large .brand-name {
  font-size: 21px;
  letter-spacing: 0.08em;
}
.brand-large .brand-motto {
  max-width: 280px;
  margin-top: 4px;
  font-size: 10.5px;
}
.login-story-center {
  margin: auto 0;
  padding: 60px 0;
  max-width: 650px;
}
.overline {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.25em;
}
.overline-gold {
  color: var(--gold-light);
}
.gold-line {
  display: block;
  width: 28px;
  height: 1px;
  background: currentColor;
}
.login-story-center h1 {
  margin: 25px 0 20px;
  font-family: "Montserrat", sans-serif;
  font-weight: 650;
  font-size: clamp(36px, 3.4vw, 58px);
  line-height: 1.19;
  letter-spacing: -0.047em;
}
.login-story-center h1 em {
  font-style: normal;
  color: #e6c280;
}
.login-story-center p {
  max-width: 440px;
  margin: 0;
  font-size: 14px;
  line-height: 1.85;
  color: #b8c9d9;
}
.login-story-bottom {
  display: flex;
  align-items: center;
  gap: 23px;
  color: #8ea7be;
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 0.16em;
}
.story-index {
  color: var(--gold-light);
  font-size: 11px;
  letter-spacing: 0.06em;
}
.story-geometry {
  position: absolute;
  z-index: 1;
  width: 690px;
  height: 690px;
  top: 50%;
  right: -430px;
  transform: translateY(-50%);
  pointer-events: none;
  opacity: 0.72;
  animation: geometry-drift 22s ease-in-out infinite alternate;
}
.geometry-ring {
  position: absolute;
  display: block;
  border: 1px solid rgba(230, 194, 128, 0.29);
  border-radius: 50%;
}
.ring-one {
  inset: 0;
}
.ring-two {
  inset: 94px;
  border-color: rgba(230, 194, 128, 0.2);
}
.ring-three {
  inset: 185px;
  border-color: rgba(230, 194, 128, 0.39);
}
.geometry-core {
  position: absolute;
  left: 280px;
  top: 280px;
  width: 130px;
  height: 130px;
  border: 1px solid rgba(230, 194, 128, 0.52);
  transform: rotate(45deg);
}
.login-form-side {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  min-height: 100svh;
  padding: 43px clamp(39px, 6vw, 105px) 31px;
  background: #faf9f6;
}
.login-form-top {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 12px;
  color: #8190a1;
  font-size: 9px;
  font-weight: 800;
  letter-spacing: 0.16em;
  white-space: nowrap;
}
.login-top-rule {
  width: 24px;
  height: 1px;
  background: var(--gold);
}
.login-form-wrap {
  width: 100%;
  max-width: 420px;
  margin: auto;
  padding: 54px 0;
}
.login-mobile-brand {
  display: none;
}
.login-form-wrap h2 {
  margin: 13px 0 13px;
  color: var(--navy-dark);
  font-family: "Montserrat", sans-serif;
  font-size: clamp(32px, 2.6vw, 42px);
  line-height: 1.2;
  letter-spacing: -0.045em;
  font-weight: 700;
}
.login-intro {
  max-width: 365px;
  margin: 0 0 34px;
  color: #78869a;
  font-size: 13px;
  line-height: 1.85;
}
.login-form {
  display: flex;
  flex-direction: column;
}
.login-form label {
  margin-bottom: 9px;
  color: #213b55;
  font-size: 12px;
  font-weight: 700;
}
.input-with-icon {
  display: flex;
  align-items: center;
  gap: 12px;
  height: 53px;
  margin-bottom: 22px;
  padding: 0 15px;
  border: 1px solid #dfe5e9;
  border-radius: 8px;
  background: #fff;
  color: #91a0ae;
  transition:
    border-color 0.2s,
    box-shadow 0.2s;
}
.input-with-icon:focus-within {
  border-color: #c49b4b;
  box-shadow: 0 0 0 3px rgba(196, 155, 75, 0.1);
}
.input-with-icon input {
  min-width: 0;
  flex: 1;
  height: 100%;
  border: 0;
  outline: 0;
  background: transparent;
  color: var(--navy-dark);
  font-size: 13px;
}
.input-with-icon input::placeholder {
  color: #a0acb8;
}
.password-toggle {
  display: flex;
  padding: 5px;
  margin-right: -4px;
  border: 0;
  background: transparent;
  color: #8c9bab;
}
.password-toggle:hover {
  color: var(--navy);
}
.login-submit {
  width: 100%;
  height: 53px;
  margin-top: 7px;
  justify-content: space-between;
  padding: 0 20px;
  font-size: 13px;
}
.form-error {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  margin: -4px 0 15px;
  padding: 11px 12px;
  border-radius: 7px;
  background: #fff0ee;
  color: #a83d36;
  font-size: 11px;
  line-height: 1.5;
}
.form-error svg {
  flex: none;
}
.login-help {
  display: flex;
  align-items: flex-start;
  gap: 9px;
  margin: 26px 0 0;
  padding: 13px 14px;
  border: 1px solid #e6e9ec;
  border-radius: 8px;
  background: #fff;
  color: #76859a;
  font-size: 10px;
  line-height: 1.6;
}
.login-help svg {
  flex: none;
  margin-top: 1px;
  color: var(--gold);
}
.login-bottom {
  display: flex;
  justify-content: space-between;
  gap: 20px;
  color: #99a4ad;
  font-size: 10px;
  white-space: nowrap;
}

/* Shared application shell */
.app-shell {
  min-height: 100vh;
  background: var(--paper);
}
.sidebar {
  position: fixed;
  z-index: 40;
  inset: 0 auto 0 0;
  display: flex;
  flex-direction: column;
  width: 263px;
  overflow-y: auto;
  background: linear-gradient(167deg, #0c3460 0%, #0a2c52 52%, #07213e 100%);
  color: #fff;
  box-shadow: 8px 0 25px rgba(7, 33, 62, 0.08);
}
.sidebar::before {
  content: "";
  position: absolute;
  pointer-events: none;
  width: 320px;
  height: 320px;
  left: -170px;
  bottom: 140px;
  border: 1px solid rgba(230, 194, 128, 0.08);
  border-radius: 50%;
  box-shadow:
    0 0 0 55px rgba(230, 194, 128, 0.025),
    0 0 0 110px rgba(230, 194, 128, 0.018);
}
.sidebar-brand {
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 100px;
  padding: 22px 21px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.085);
}
.sidebar .brand {
  gap: 9px;
}
.sidebar .brand-name {
  font-size: 14px;
  letter-spacing: 0.05em;
}
.sidebar .brand-motto {
  max-width: 160px;
  font-size: 8px;
  line-height: 1.45;
}
.sidebar-section-label {
  position: relative;
  margin: 36px 24px 13px;
  color: #7898b6;
  font-size: 9px;
  font-weight: 800;
  letter-spacing: 0.18em;
}
.sidebar-nav {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 0 13px;
}
.nav-item {
  position: relative;
  display: flex;
  align-items: center;
  width: 100%;
  min-height: 47px;
  gap: 13px;
  padding: 0 14px;
  border: 0;
  border-radius: 8px;
  background: transparent;
  color: #abc0d2;
  font-size: 12.5px;
  font-weight: 550;
  text-align: left;
  transition:
    background 0.2s,
    color 0.2s,
    transform 0.2s;
}
.nav-item:hover {
  background: rgba(255, 255, 255, 0.07);
  color: #fff;
  transform: translateX(2px);
}
.nav-active {
  background: rgba(255, 255, 255, 0.12);
  color: #fff;
  font-weight: 700;
}
.nav-active > svg {
  color: #e6c280;
}
.nav-indicator {
  position: absolute;
  left: -13px;
  top: 9px;
  height: 29px;
  width: 3px;
  border-radius: 0 4px 4px 0;
  background: var(--gold-light);
}
.sidebar-bottom {
  position: relative;
  margin-top: auto;
  padding: 28px 14px 17px;
}
.sidebar-account {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 17px 3px 13px;
  border-top: 1px solid rgba(255, 255, 255, 0.13);
}
.sidebar-account > div {
  display: flex;
  flex-direction: column;
  min-width: 0;
  flex: 1;
  gap: 4px;
}
.sidebar-account strong {
  overflow: hidden;
  color: #fff;
  font-size: 11px;
  font-weight: 700;
  white-space: nowrap;
  text-overflow: ellipsis;
}
.sidebar-account span:not(.avatar) {
  color: #94acc2;
  font-size: 9px;
}
.sidebar-logout {
  width: 29px;
  height: 32px;
  color: #9eb5c9;
}
.sidebar-logout:hover {
  color: #fff;
}
.sidebar-mobile-close,
.sidebar-backdrop,
.mobile-menu {
  display: none;
}
.workspace {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  margin-left: 263px;
  padding: 0 clamp(27px, 3vw, 47px);
}
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  min-height: 78px;
  border-bottom: 1px solid #e5e4e1;
}
.topbar-left,
.topbar-right {
  display: flex;
  align-items: center;
  gap: 12px;
}
.topbar-left {
  min-width: 0;
  color: #8a98a8;
  font-size: 11px;
}
.topbar-left strong {
  overflow: hidden;
  color: var(--navy);
  font-size: 11px;
  font-weight: 700;
  white-space: nowrap;
  text-overflow: ellipsis;
}
.topbar-chevron {
  color: #b3bdc5;
}
.topbar-right {
  gap: 19px;
}
.topbar-date {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  color: #718197;
  font-size: 11px;
  white-space: nowrap;
}
.topbar-date svg {
  color: var(--gold);
}
.topbar-divider {
  width: 1px;
  height: 22px;
  background: #dce2e6;
}
.workspace-content {
  width: 100%;
  max-width: 1500px;
  margin: 0 auto;
  flex: 1;
  animation: content-enter 0.48s ease both;
}
.workspace-footer {
  display: flex;
  justify-content: space-between;
  gap: 20px;
  max-width: 1500px;
  width: 100%;
  padding: 36px 0 24px;
  margin: auto auto 0;
  color: #9aa5ad;
  font-size: 10px;
}
.footer-maintenance {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 0;
  border: 0;
  background: transparent;
  color: #a4aeb7;
  font-size: 10px;
}
.footer-maintenance:hover {
  color: var(--navy);
  text-decoration: underline;
}
.page-heading {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 20px;
  margin: 39px 0 26px;
}
.page-heading h1,
.course-detail-heading h1 {
  margin: 7px 0 8px;
  color: var(--navy-dark);
  font-family: "Montserrat", sans-serif;
  font-size: clamp(27px, 2.35vw, 33px);
  font-weight: 700;
  letter-spacing: -0.045em;
  line-height: 1.25;
}
.page-heading p,
.course-detail-heading p {
  margin: 0;
  color: #7f8c9a;
  font-size: 12px;
  line-height: 1.6;
}
.heading-action {
  flex: none;
  padding-bottom: 2px;
}
.avatar {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 40px;
  height: 40px;
  flex: none;
  border-radius: 50%;
  font-family: "Montserrat", sans-serif;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: -0.02em;
}
.avatar-small {
  width: 34px;
  height: 34px;
  font-size: 10px;
}
.avatar-0 {
  background: #e9edf6;
  color: #3e5d89;
}
.avatar-1 {
  background: #f2e9d9;
  color: #8e6a37;
}
.avatar-2 {
  background: #e5f0ed;
  color: #347a6c;
}
.sidebar .avatar {
  background: #e8ca8e;
  color: #0c3460;
}

/* Formateur overview and data views */
.kpi-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 17px;
  margin-bottom: 21px;
}
.kpi-card {
  min-width: 0;
  padding: 19px 20px 0;
  border: 1px solid #e8e9ea;
  border-radius: 13px;
  background: #fff;
  box-shadow: 0 4px 16px rgba(15, 46, 76, 0.035);
  transition:
    transform 0.25s ease,
    box-shadow 0.25s ease;
}
.kpi-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 12px 25px rgba(15, 46, 76, 0.09);
}
.kpi-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
}
.kpi-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 40px;
  height: 40px;
  border-radius: 9px;
}
.kpi-blue {
  background: #eaf0f7;
  color: #255380;
}
.kpi-gold {
  background: #fbf3e4;
  color: #bd8b35;
}
.kpi-violet {
  background: #eeecf7;
  color: #72649a;
}
.kpi-green {
  background: #e9f3ed;
  color: #478a65;
}
.kpi-arrow {
  margin-top: 5px;
  color: #bdc7ce;
  transform: rotate(-45deg);
}
.kpi-value {
  margin-top: 16px;
  color: var(--navy-dark);
  font-family: "Montserrat", sans-serif;
  font-size: clamp(25px, 2.1vw, 31px);
  font-weight: 700;
  line-height: 1.2;
  letter-spacing: -0.055em;
  white-space: nowrap;
}
.kpi-label {
  margin-top: 4px;
  color: #425770;
  font-size: 12px;
  font-weight: 650;
}
.kpi-note {
  overflow: hidden;
  padding: 14px 0 15px;
  margin-top: 17px;

.submit-note {

.modal-overlay {
  position: fixed;
  z-index: 90;
  inset: 0;
  display: flex;

  justify-content: center;

.confirm-symbol {

.inspection-section {

.inspection-proof {

.inspection-thumb {

.inspection-proof strong {

.inspection-proof span {

.inspection-proof-actions {

}
.inspection-proof-actions .icon-button {

.inspection-proof-actions .icon-button:hover {

.no-proof {

.nested-preview {

.nested-preview-inner {

  align-items: center;
  justify-content: space-between;
  width: 100%;
  color: var(--navy);
  font-size: 12px;

.nested-preview-top .icon-button {

  height: 30px;

  align-items: center;

.proof-modal-preview {

  align-items: center;
  justify-content: center;

  border-radius: 8px;
  background: #eef2f5;
}
.proof-modal-preview img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
}
.proof-modal-preview iframe {
  width: 100%;
  height: 100%;
  border: 0;
}
.proof-modal-bottom {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
  margin-top: 14px;

.proof-modal-bottom > span {

  white-space: nowrap;

.toast-stack {
  position: fixed;
  z-index: 150;
  top: 20px;
  right: 20px;
  display: flex;
  flex-direction: column;
  gap: 9px;
  width: min(355px, calc(100vw - 35px));
  pointer-events: none;
}
.toast {
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 55px;
  padding: 11px 12px;
  border: 1px solid #e5e9ec;
  border-left: 3px solid #4a9766;
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.97);
  box-shadow: 0 12px 35px rgba(8, 37, 64, 0.16);
  color: #294258;
  font-size: 11px;
  font-weight: 600;
  line-height: 1.45;
  backdrop-filter: blur(12px);
  pointer-events: auto;
  animation: toast-in 0.3s ease both;
}
.toast-error {
  border-left-color: #c35c52;
}
.toast-info {
  border-left-color: #c49b4b;
}
.toast-symbol {
  display: flex;
  color: #469767;
  flex: none;
}
.toast-error .toast-symbol {
  color: #c35c52;
}
.toast-info .toast-symbol {
  color: #c49b4b;
}
.toast > span:nth-child(2) {
  flex: 1;
}
.toast-close {
  width: 22px;
  height: 22px;
  color: #9aa7b2;
}

@keyframes geometry-drift {
  from {
    transform: translateY(-50%) rotate(-8deg) scale(1);
  }
  to {
    transform: translateY(-48%) rotate(12deg) scale(1.045);
  }
}
@keyframes content-enter {
  from {
    opacity: 0;
    transform: translateY(11px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
@keyframes ring-arrive {
  from {
    opacity: 0.25;
    transform: scale(0.88);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}
@keyframes overlay-in {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}
@keyframes dialog-in {
  from {
    opacity: 0;
    transform: translateY(12px) scale(0.985);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}
@keyframes toast-in {
  from {
    opacity: 0;
    transform: translateX(20px);
  }
  to {
    opacity: 1;
    transform: translateX(0);
  }
}

  .sidebar {
    width: 239px;
  }
  .workspace {

}
.help-tour-button:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 24px rgba(196, 155, 75, 0.2);
}
.help-tour-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 38px;
  height: 38px;
  border-radius: 9px;
  background: var(--navy);
  color: var(--gold-light);
}
.help-tour-button strong {
  display: block;
  font-size: 12px;
}
.help-tour-button small {
  display: block;
  margin-top: 3px;
  color: #8f7a52;
  font-size: 10px;
  line-height: 1.5;
}
.help-topics {
  display: flex;
  flex-direction: column;
  gap: 7px;
}
.help-topic {
  border: 1px solid #e7ebee;
  border-radius: 9px;
  background: #fff;
  overflow: hidden;
}
.help-topic summary {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 13px 15px;
  color: var(--navy-dark);
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  list-style: none;
}
.help-topic summary::-webkit-details-marker {
  display: none;
}
.help-topic summary svg {
  flex: none;
  color: #9aa7b3;
  transition: transform 0.2s;
}
.help-topic[open] summary svg {
  transform: rotate(90deg);
}
.help-topic[open] summary {
  background: #f8f9fa;
}
.help-topic p {
  margin: 0;
  padding: 12px 15px 15px;
  color: #5a6d82;
  font-size: 11.5px;
  line-height: 1.75;
}
.help-footer {
  display: flex;
  align-items: center;
  gap: 7px;
  margin: auto 0 0;
  padding-top: 20px;
  color: #9aa6b1;
  font-size: 10px;
}
.help-footer svg {
  color: var(--gold);
}

/* Checklist de démarrage */
.checklist {
  margin-bottom: 21px;
  overflow: hidden;
}
.checklist-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  padding: 22px 26px 18px;
  border-bottom: 1px solid #eef0f2;
}
.checklist-heading h2 {
  margin: 6px 0 5px;
  color: var(--navy-dark);
  font-family: "Montserrat", sans-serif;
  font-size: 16px;
  letter-spacing: -0.03em;
}
.checklist-heading p {
  margin: 0;
  color: #8a97a5;
  font-size: 11px;
  line-height: 1.6;
}
.checklist-meter {
  display: grid;
  grid-template-columns: auto 120px;
  grid-template-rows: auto auto;
  align-items: center;
  column-gap: 12px;
  row-gap: 6px;
  flex: none;
}
.checklist-meter strong {
  color: var(--navy);
  font-family: "Montserrat", sans-serif;
  font-size: 18px;
  letter-spacing: -0.03em;
}
.checklist-meter > div {
  height: 6px;
  border-radius: 10px;
  background: #e9edf0;
  overflow: hidden;
}
.checklist-meter i {
  display: block;
  height: 100%;
  border-radius: 10px;
  background: linear-gradient(90deg, #c49b4b, #e6c280);
  transition: width 0.6s ease;
}
.checklist-hide {
  grid-column: 1 / -1;
  justify-self: end;
  padding: 0;
  border: 0;
  background: transparent;
  color: #98a4ae;
  font-size: 10px;
}
.checklist-hide:hover {
  color: var(--navy);
  text-decoration: underline;
}
.checklist-items {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  margin: 0;
  padding: 0;
  list-style: none;
}
.checklist-item {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 18px 20px 16px;
  border-right: 1px solid #eef0f2;
  transition: background 0.2s;
}
.checklist-item:last-child {
  border-right: 0;
}
.checklist-item > div {
  flex: 1;
}
.checklist-item strong {
  display: block;
  color: #27425c;
  font-size: 12px;
  line-height: 1.4;
}
.checklist-item > div > span {
  display: block;
  margin-top: 5px;
  color: #94a1ad;
  font-size: 10px;
  line-height: 1.55;
}
.checklist-mark {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  border: 1.5px solid #d6dde3;
  color: #7f8e9c;
  font-size: 10px;
  font-weight: 800;
}
.item-done .checklist-mark {
  border-color: #3d8a5f;
  background: #3d8a5f;
  color: #fff;
}
.item-done strong {
  color: #6f8295;
  text-decoration: line-through;
  text-decoration-color: #c5ced6;
}
.item-current {
  background: linear-gradient(180deg, #fffcf4, #fff);
}
.item-current::before {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  height: 3px;
  background: linear-gradient(90deg, #c49b4b, #e6c280);
}
.item-current .checklist-mark {
  border-color: var(--gold);
  background: #fff6e2;
  color: #a67a2d;
}
.checklist-action {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  align-self: flex-start;
  padding: 0;
  border: 0;
  background: transparent;
  color: var(--navy);
  font-size: 11px;
  font-weight: 750;
}
.checklist-action svg {
  transition: transform 0.2s;
}
.checklist-action:hover svg {
  transform: translateX(3px);
}
.checklist-complete .checklist-heading {
  border-bottom: 0;
}
.checklist-complete .checklist-items {
  display: none;
}

/* Prochaine étape étudiant */
.next-action {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center;
  gap: 18px;
  padding: 20px 24px;
  margin-top: 20px;
  border: 1px solid #e8d9b8;
  border-radius: 13px;
  background: linear-gradient(135deg, #fffdf7, #fbf3e1);
}
.next-action-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 46px;
  height: 46px;
  border-radius: 12px;
  background: var(--navy);
  color: var(--gold-light);
}
.next-action-copy strong {
  display: block;
  margin: 6px 0 4px;
  color: var(--navy-dark);
  font-family: "Montserrat", sans-serif;
  font-size: 15px;
  letter-spacing: -0.03em;
  line-height: 1.35;
}
.next-action-copy > span:not(.panel-kicker) {
  display: block;
  color: #8a7a5c;
  font-size: 11px;
  line-height: 1.6;
}

/* Parcours guidé du cours */
.course-steps {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 6px;
  margin: 18px 0 8px;
  padding: 0;
  list-style: none;
}
.course-step {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 7px;
  padding: 10px 4px;
  border-radius: 8px;
  background: #f6f8f9;
  text-align: center;
}
.course-step-mark {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  border: 1.5px solid #d3dbe2;
  background: #fff;
  color: #7f8e9c;
  font-size: 10px;
  font-weight: 800;
}
.course-step-label {
  color: #7a8a99;
  font-size: 9px;
  font-weight: 650;
  line-height: 1.3;
}
.step-done {
  background: #ecf7f0;
}
.step-done .course-step-mark {
  border-color: #3d8a5f;
  background: #3d8a5f;
  color: #fff;
}
.step-done .course-step-label {
  color: #2f6b4a;
}
.step-current {
  background: #fff6e2;
  box-shadow: inset 0 0 0 1px #ecd7a8;
}
.step-current .course-step-mark {
  border-color: var(--gold);
  color: #a67a2d;
}
.step-current .course-step-label {
  color: #8d6420;
}
.course-steps-meter {
  height: 5px;
  border-radius: 10px;
  background: #e9edf0;
  overflow: hidden;
}
.course-steps-meter i {
  display: block;
  height: 100%;
  border-radius: 10px;
  background: linear-gradient(90deg, #c49b4b, #e6c280);
  transition: width 0.5s ease;
}
.form-step-done {
  background: #3d8a5f;
  color: #fff;
}
.char-count-ok {
  color: #3d8a5f;
}
.submit-incomplete {
  background: #4d6b8a;
  box-shadow: none;
}
.submit-incomplete:hover {
  background: var(--navy);
}

/* Statuts d'accès et d'inspection */
.access-sent,
.access-pending {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  margin-top: 4px;
  font-size: 9.5px;
  font-weight: 650;
}
.access-sent {
  color: #3d8a5f;
}
.access-pending {
  color: #b7801f;
}
.button-view-new {
  border-color: #e6c280;
  background: #fff6e2;
}
.reviewed-text {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  color: #3d8a5f;
  font-size: 10px;
  font-weight: 650;
}
.new-report-text {
  padding: 3px 7px;
  border-radius: 5px;
  background: #fff1d6;
  color: #9a6c1a;
  font-size: 9px;
  font-weight: 800;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

@media (max-width: 1080px) {
  .checklist-items {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .checklist-item:nth-child(2) {
    border-right: 0;
  }
  .checklist-item:nth-child(-n + 2) {
    border-bottom: 1px solid #eef0f2;
  }
}
@media (max-width: 820px) {
  .pending-chip {
    display: none;
  }
}
@media (max-width: 600px) {
  .help-button small {
    display: none;
  }
  .help-button {
    padding: 0 5px;
    gap: 0;
  }
  .checklist-heading {
    flex-direction: column;
    align-items: stretch;
    gap: 14px;
    padding: 18px 16px 14px;
  }
  .checklist-meter {
    grid-template-columns: auto 1fr;
  }
  .checklist-items {
    grid-template-columns: 1fr;
  }
  .checklist-item {
    border-right: 0;
    border-bottom: 1px solid #eef0f2;
  }
  .checklist-item:last-child {
    border-bottom: 0;
  }
  .next-action {
    grid-template-columns: auto minmax(0, 1fr);
    padding: 16px;
  }
  .next-action .button {
    grid-column: 1 / -1;
    width: 100%;
  }
  .course-steps {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .help-panel {
    padding: 20px 18px 18px;
  }
  .tour-card {
    padding: 17px 17px 15px;
  }
}

/* ---------- Bilans hebdomadaires ---------- */
.nav-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 19px;
  height: 19px;
  padding: 0 5px;
  margin-left: auto;
  border-radius: 10px;
  background: #e6c280;
  color: #0c3460;
  font-size: 10px;
  font-weight: 800;
}
.weekly-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  width: max-content;
  padding: 6px 9px;
  border-radius: 6px;
  font-size: 10px;
  font-weight: 700;
  white-space: nowrap;
}
.weekly-pending {
  background: #fff5e4;
  color: #a87520;
}
.weekly-on_time {
  background: #e8f5ed;
  color: #357a51;
}
.weekly-late {
  background: #fdf0e6;
  color: #b4602a;
}
.weekly-missing {
  background: #fdecec;
  color: #b64f4f;
}

/* Bannière étudiant */
.weekly-banner {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center;
  gap: 18px;
  padding: 20px 24px;
  margin-top: 20px;
  border: 1px solid #d9e3ec;
  border-left: 4px solid var(--navy);
  border-radius: 13px;
  background: #fff;
  box-shadow: 0 4px 16px rgba(15, 46, 76, 0.04);
}
.weekly-banner-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 46px;
  height: 46px;
  border-radius: 12px;
  background: #eaf0f7;
  color: var(--navy);
}
.weekly-banner-copy strong {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 12px;
  margin: 6px 0 4px;
  color: var(--navy-dark);
  font-family: "Montserrat", sans-serif;
  font-size: 15px;
  letter-spacing: -0.03em;
}
.weekly-banner-copy > span:not(.panel-kicker):not(.weekly-missed) {
  display: block;
  color: #7f8e9c;
  font-size: 11px;
  line-height: 1.6;
}
.weekly-countdown {
  padding: 4px 9px;
  border-radius: 20px;
  background: #eaf0f7;
  color: var(--navy);
  font-family: "Inter", sans-serif;
  font-size: 10.5px;
  font-weight: 750;
  letter-spacing: 0;
}
.weekly-missed {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  margin-top: 7px;
  color: #b64f4f;
  font-size: 10.5px;
  font-weight: 650;
}
.weekly-banner-urgent {
  border-left-color: #d9842a;
  background: linear-gradient(135deg, #fffaf2, #fff);
}
.weekly-banner-urgent .weekly-banner-icon {
  background: #fdebd3;
  color: #c06d17;
  animation: pulse-dot 1.8s ease-out infinite;
}
.weekly-banner-urgent .weekly-countdown {
  background: #fdebd3;
  color: #a95a10;
}
.weekly-banner-done {
  border-left-color: #3d8a5f;
}
.weekly-banner-done .weekly-banner-icon {
  background: #e7f5ec;
  color: #3d8a5f;
}

/* Page étudiant */
.weekly-hero {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  padding: 24px 30px;
  margin-bottom: 22px;
  border-radius: 14px;
  background: linear-gradient(115deg, #0c3460, #154574);
  color: #fff;
}
.weekly-hero-copy > span {
  color: var(--gold-light);
  font-size: 9.5px;
  font-weight: 800;
  letter-spacing: 0.16em;
}
.weekly-hero-copy h2 {
  margin: 8px 0 6px;
  font-family: "Montserrat", sans-serif;
  font-size: clamp(18px, 2vw, 23px);
  letter-spacing: -0.035em;
}
.weekly-hero-copy p {
  margin: 0;
  color: #b8c9d9;
  font-size: 11.5px;
}
.weekly-hero-copy strong {
  color: #fff;
}
.weekly-hero-side {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 10px;
}
.weekly-back {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 0;
  border: 0;
  background: transparent;
  color: var(--gold-light);
  font-size: 11px;
  font-weight: 700;
}
.weekly-back:hover {
  text-decoration: underline;
}
.weekly-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 360px;
  gap: 22px;
  align-items: start;
}
.weekly-editor {
  padding: 25px 26px 24px;
}
.weekly-time {
  max-width: 340px;
  margin-top: 0;
}
.weekly-time input:disabled,
.weekly-field textarea:disabled {
  background: #f6f8f9;
  color: #556a7f;
  cursor: default;
}
.weekly-courses {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.weekly-course {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-height: 38px;
  padding: 6px 12px 6px 8px;
  border: 1px solid #dbe3e9;
  border-radius: 8px;
  background: #fff;
  color: #4d6277;
  font-size: 11px;
  font-weight: 650;
  text-align: left;
  transition:
    border-color 0.2s,
    background 0.2s;
}
.weekly-course:hover:not(:disabled) {
  border-color: var(--gold);
}
.weekly-course-check {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 18px;
  height: 18px;
  flex: none;
  border: 1.5px solid #cdd7df;
  border-radius: 5px;
  color: #fff;
}
.weekly-course-on {
  border-color: var(--gold);
  background: #fff9ec;
  color: var(--navy);
}
.weekly-course-on .weekly-course-check {
  border-color: var(--navy);
  background: var(--navy);
}
.weekly-field {
  display: block;
  margin-bottom: 14px;
  color: #3b546c;
  font-size: 11px;
  font-weight: 700;
}
.weekly-field small,
.weekly-attachments-title small {
  color: #9aa7b2;
  font-weight: 500;
}
.weekly-field .report-textarea {
  margin-top: 7px;
}
.weekly-textarea-small {
  min-height: 80px;
}
.weekly-attachments {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding-top: 16px;
  margin-top: 6px;
  border-top: 1px solid #edf0f1;
}
.weekly-attachments-title {
  color: #3b546c;
  font-size: 11px;
  font-weight: 700;
}
.weekly-attach-button {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  align-self: flex-start;
  min-height: 34px;
  padding: 0 12px;
  border: 1px dashed #c8d4dd;
  border-radius: 7px;
  background: #fafcfd;
  color: var(--navy);
  font-size: 10.5px;
  font-weight: 700;
}
.weekly-attach-button:hover:not(:disabled) {
  border-color: var(--gold);
}
.weekly-submit {
  margin-top: 6px;
}
.weekly-history {
  overflow: hidden;
}
.weekly-history-list {
  margin: 0;
  padding: 0;
  list-style: none;
  border-top: 1px solid #edf0f2;
  max-height: 620px;
  overflow-y: auto;
}
.weekly-history-item {
  display: grid;
  grid-template-columns: 40px minmax(0, 1fr);
  grid-template-rows: auto auto;
  column-gap: 12px;
  row-gap: 7px;
  width: 100%;
  padding: 14px 20px;
  border: 0;
  border-bottom: 1px solid #f0f2f4;
  background: #fff;
  text-align: left;
  transition: background 0.2s;
}
.weekly-history-item:hover {
  background: #fbfaf6;
}
.weekly-history-active {
  background: #fff9ec;
  box-shadow: inset 3px 0 0 var(--gold);
}
.weekly-history-week {
  grid-row: 1 / 3;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 40px;
  height: 40px;
  border-radius: 9px;
  background: #eef2f6;
  color: var(--navy);
  font-family: "Montserrat", sans-serif;
  font-size: 11px;
  font-weight: 800;
}
.weekly-history-copy strong {
  display: block;
  color: #27425c;
  font-size: 11px;
}
.weekly-history-copy span {
  display: block;
  margin-top: 3px;
  color: #98a5b0;
  font-size: 9.5px;
}
.weekly-history-item .weekly-badge {
  grid-column: 2;
}

/* Page formateur */
.weekly-admin-head {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  gap: 24px;
  padding: 20px 24px;
  margin-bottom: 21px;
}
.weekly-admin-week {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
}
.weekly-admin-week > div {
  min-width: 0;
}
.weekly-admin-week select {
  display: block;
  max-width: 100%;
  margin: 6px 0 4px;
  padding: 0;
  border: 0;
  background: transparent;
  color: var(--navy-dark);
  font-family: "Montserrat", sans-serif;
  font-size: 17px;
  font-weight: 700;
  letter-spacing: -0.03em;
  cursor: pointer;
  outline: 0;
}
.weekly-admin-week p {
  margin: 0;
  color: #8a97a5;
  font-size: 11px;
}
.weekly-admin-week p strong {
  color: var(--navy);
}
.weekly-nav {
  width: 36px;
  height: 36px;
  border: 1px solid #dfe5ea;
  border-radius: 9px;
  color: var(--navy);
}
.weekly-nav:hover:not(:disabled) {
  background: #eef3f8;
}
.weekly-stats {
  display: flex;
  gap: 8px;
}
.weekly-stat {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 3px;
  min-width: 96px;
  padding: 11px 13px;
  border: 1px solid #e5e9ec;
  border-radius: 10px;
  background: #fff;
  text-align: left;
  transition:
    border-color 0.2s,
    transform 0.2s;
}
button.weekly-stat:hover {
  transform: translateY(-2px);
}
.weekly-stat strong {

    const credentials = {};
    for (const student of recipients) {
        const username = values[student.id]?.username?.trim() || "";
        const password = values[student.id]?.password || "";
        if ((username && !password) || (!username && password)) {
            return {
                credentials: {},
                error: `Renseignez l'e-mail (ou le nom d'utilisateur) et le mot de passe de ${student.name}, ou laissez les deux champs vides.`,
            };
        }
        if (username && password)
            credentials[student.id] = { username, password };
    }
    if (Object.keys(credentials).length > 0 &&
        Object.keys(credentials).length < recipients.length) {
        const missing = recipients.filter((student) => !credentials[student.id]);
        return {
            credentials: {},
            error: `Ajoutez aussi les accès de ${missing.map((student) => student.name).join(", ")}, ou ciblez uniquement les étudiants concernés.`,
        };
    }

}

        // Local HTML files can block the Clipboard API; try the legacy selection path.

    field.value = value;
    field.setAttribute("readonly", "");
    field.style.position = "fixed";
    field.style.opacity = "0";
    document.body.appendChild(field);

        field.remove();
    }

/**
 * Visite guidée interactive : met en lumière un élément de l'interface
 * (attribut data-tour) et affiche une carte explicative étape par étape.
 */
function GuidedTour({ steps, onStep, onClose, }) {
    const [index, setIndex] = useState(0);
    const [rect, setRect] = useState(null);
    const step = steps[index];
    useEffect(() => {
        onStep?.(step);
        let frame = 0;
        let attempts = 0;
        function measure() {
            const element = document.querySelector(`[data-tour="${step.target}"]`);
            if (!element) {
                if (attempts++ < 20)
                    frame = window.setTimeout(measure, 60);
                else
                    setRect(null);
                return;
            }
            const box = element.getBoundingClientRect();
            if (box.width === 0 && box.height === 0) {
                if (attempts++ < 20)
                    frame = window.setTimeout(measure, 60);
                else
                    setRect(null);
                return;
            }
            const margin = 8;
            setRect({
                top: box.top - margin,
                left: box.left - margin,
                width: box.width + margin * 2,
                height: box.height + margin * 2,
            });
        }
        const element = document.querySelector(`[data-tour="${step.target}"]`);
        element?.scrollIntoView({ block: "center", behavior: "smooth" });
        frame = window.setTimeout(measure, element ? 320 : 0);
        const refresh = () => measure();
        window.addEventListener("resize", refresh);
        window.addEventListener("scroll", refresh, true);
        return () => {
            window.clearTimeout(frame);
            window.removeEventListener("resize", refresh);
            window.removeEventListener("scroll", refresh, true);
        };
    }, [step, onStep]);
    useEffect(() => {
        function onKey(event) {
            if (event.key === "Escape")
                onClose();
            if (event.key === "ArrowRight" && index < steps.length - 1)
                setIndex(index + 1);
            if (event.key === "ArrowLeft" && index > 0)
                setIndex(index - 1);
        }
        window.addEventListener("keydown", onKey);
        return () => window.removeEventListener("keydown", onKey);
    }, [index, steps.length, onClose]);
    const isLast = index === steps.length - 1;
    const viewportHeight = typeof window !== "undefined" ? window.innerHeight : 0;
    const viewportWidth = typeof window !== "undefined" ? window.innerWidth : 0;
    const compact = viewportWidth < 700;
    let cardStyle = {};
    if (!compact && rect) {
        const below = rect.top + rect.height + 250 < viewportHeight;
        const left = Math.min(Math.max(16, rect.left), viewportWidth - 376);
        cardStyle = below
            ? { top: rect.top + rect.height + 14, left }
            : { bottom: viewportHeight - rect.top + 14, left };
    }
    return (<div className="tour-layer" role="dialog" aria-modal="true" aria-label="Visite guidée">
      <div className="tour-backdrop" onClick={onClose}/>
      {rect ? (<div className="tour-spotlight" style={{
                top: rect.top,
                left: rect.left,
                width: rect.width,
                height: rect.height,
            }}/>) : (<div className="tour-spotlight tour-spotlight-hidden"/>)}
      <div className={`tour-card ${compact || !rect ? "tour-card-docked" : ""}`} style={cardStyle}>
        <div className="tour-card-top">
          <span className="tour-progress">
            Étape {index + 1} / {steps.length}
          </span>
          <button type="button" className="icon-button tour-close" onClick={onClose} aria-label="Quitter la visite">
            <Icon name="close" size={16}/>
          </button>
        </div>
        <h3>{step.title}</h3>
        <p>{step.text}</p>
        <div className="tour-dots" aria-hidden="true">
          {steps.map((item, dot) => (<i key={item.target} className={dot === index ? "dot-active" : ""}/>))}
        </div>
        <div className="tour-actions">
          <button type="button" className="tour-skip" onClick={onClose}>
            {isLast ? "Fermer" : "Passer la visite"}
          </button>
          <div className="tour-nav">
            {index > 0 && (<button type="button" className="button button-secondary tour-button" onClick={() => setIndex(index - 1)}>
                Précédent
              </button>)}
            <button type="button" className="button button-primary tour-button" onClick={() => (isLast ? onClose() : setIndex(index + 1))}>
              {isLast ? "Terminer" : "Suivant"}
              {!isLast && <Icon name="arrowRight" size={16}/>}
            </button>
          </div>
        </div>
      </div>
    </div>);
}

function readFileAsDataUrl(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => typeof reader.result === "string"
            ? resolve(reader.result)
            : reject(new Error("Lecture du fichier impossible."));
        reader.onerror = () => reject(new Error("Lecture du fichier impossible."));
        reader.readAsDataURL(file);
    });
}

                ...current,
                hours: Math.floor(total / 60),

                timerSeconds: 0,

    async function addFiles(files) {

            "image/jpeg",
            "image/webp",

            onNotify("Formats acceptés : PNG, JPG, WEBP ou PDF.", "error");
            return;
        }
        if (files.some((file) => file.size > 2 * 1024 * 1024)) {
            onNotify("Chaque fichier doit peser moins de 2 Mo.", "error");
            return;

        setUploading(true);

                size: file.size,

            onUpdate(studentId, course.id, (current) => ({

            }));

const WEEKLY_LABELS = {
    pending: "À rendre",
    on_time: "Rendu à temps",
    late: "Rendu en retard",
    missing: "Non rendu",
};
function WeeklyStatusBadge({ status }) {
    return (<span className={`weekly-badge weekly-${status}`}>
      <span className="status-dot"/>
      {WEEKLY_LABELS[status]}
    </span>);
}
/** Lecture et contrôle des pièces jointes (images ou PDF, 2 Mo max). */
async function readProofFiles(files, existing, maxFiles) {
    const allowed = ["image/png", "image/jpeg", "image/webp", "application/pdf"];
    if (files.some((file) => !allowed.includes(file.type)))
        return { error: "Formats acceptés : PNG, JPG, WEBP ou PDF." };
    if (files.some((file) => file.size > 2 * 1024 * 1024))
        return { error: "Chaque fichier doit peser moins de 2 Mo." };
    if (existing.length + files.length > maxFiles)
        return { error: `${maxFiles} fichiers maximum.` };
    try {
        const proofs = await Promise.all(files.map(async (file) => ({
            id: makeId(),
            name: file.name,
            type: file.type,
            size: file.size,
            dataUrl: await readFileAsDataUrl(file),
        })));
        return { proofs };
    }
    catch {
        return { error: "Impossible de lire le fichier. Réessayez." };
    }
}
/** Bannière d'échéance de l'accueil étudiant. */

    const urgent = status === "pending" && remaining < 24 * 3600000;

      </span>

        <span className="panel-kicker">
          BILAN HEBDOMADAIRE · {weekLabel(week, false).toUpperCase()}
        </span>
        {status === "pending" ? (<>
            <strong>
              À rendre avant le {formatDeadline(week)}
              <span className="weekly-countdown">
                Il reste {formatRemaining(remaining)}
              </span>
            </strong>
            <span>
              {report && (report.summary || report.hours || report.minutes)
                ? "Votre brouillon est enregistré : finalisez-le et transmettez-le à votre formateur."

        {missedCount > 0 && (<span className="weekly-missed">

        emptyWeeklyReport(student.id, selectedWeek);
    const status = weeklyStatus(reports.find((item) => item.weekStart === selectedWeek), selectedWeek, now);
    const deadline = weekDeadline(selectedWeek).getTime();
    const editable = !report.submittedAt || now <= deadline;
    const isCurrent = selectedWeek === currentWeek;
    const steps = [
        {
            id: "time",

        {

            done: report.courseIds.length > 0,
        },
        {
            id: "summary",

            onNotify(result.error, "error");
            return;

            proofs: [...current.proofs, ...(result.proofs || [])],

          <p>
            Échéance : {formatDeadline(selectedWeek)}

/** Espace formateur : suivi des bilans semaine par semaine. */
function AdminWeekly({ students, reports, now, onInspect, onRemind, }) {
    const currentWeek = weekKeyOf(new Date(now));
    const [week, setWeek] = useState(currentWeek);
    const [cohort, setCohort] = useState("all");
    const [statusFilter, setStatusFilter] = useState("all");
    const earliest = students.reduce((min, student) => {
        const key = weekKeyOf(new Date(student.createdAt));
        return key < min ? key : min;
    }, currentWeek);
    const weeks = [];
    for (let key = currentWeek; key >= earliest && weeks.length < 104; key = addWeeks(key, -1))
        weeks.push(key);
    const deadline = weekDeadline(week).getTime();
    const rows = students
        .filter((student) => new Date(student.createdAt).getTime() <= deadline)
        .filter((student) => cohort === "all" || student.cohort === cohort)
        .map((student) => {
        const report = reports.find((item) => item.studentId === student.id && item.weekStart === week);
        return { student, report, status: weeklyStatus(report, week, now) };
    })
        .sort((a, b) => a.student.name.localeCompare(b.student.name, "fr"));
    const counts = {
        on_time: rows.filter((row) => row.status === "on_time").length,
        late: rows.filter((row) => row.status === "late").length,
        pending: rows.filter((row) => row.status === "pending").length,
        missing: rows.filter((row) => row.status === "missing").length,
    };
    const visible = rows.filter((row) => statusFilter === "all" || row.status === statusFilter);
    const isCurrent = week === currentWeek;
    return (<>
      <PageHeading eyebrow="SUIVI HEBDOMADAIRE" title="Bilans hebdomadaires" subtitle="Chaque étudiant rend son bilan avant le dimanche 23:59. Suivez la régularité semaine par semaine."/>
      <section className="surface weekly-admin-head">
        <div className="weekly-admin-week">
          <button type="button" className="icon-button weekly-nav" aria-label="Semaine précédente" disabled={week <= earliest} onClick={() => setWeek(addWeeks(week, -1))}>
            <Icon name="arrowLeft" size={17}/>
          </button>
          <div>
            <span className="panel-kicker">
              S{isoWeekNumber(week)} ·{" "}
              {isCurrent ? "SEMAINE EN COURS" : "SEMAINE PASSÉE"}
            </span>
            <select aria-label="Choisir la semaine" value={week} onChange={(event) => setWeek(event.target.value)}>
              {weeks.map((key) => (<option key={key} value={key}>
                  {weekLabel(key)}
                </option>))}
            </select>
            <p>
              Échéance : {formatDeadline(week)}
              {isCurrent && (<>
                  {" "}
                  · reste <strong>{formatRemaining(deadline - now)}</strong>
                </>)}
            </p>
          </div>
          <button type="button" className="icon-button weekly-nav" aria-label="Semaine suivante" disabled={week >= currentWeek} onClick={() => setWeek(addWeeks(week, 1))}>
            <Icon name="arrowRight" size={17}/>
          </button>
        </div>
        <div className="weekly-stats">
          {[
            "on_time",
            "late",
            isCurrent ? "pending" : "missing",
        ].map((key) => (<button key={key} type="button" className={`weekly-stat weekly-stat-${key} ${statusFilter === key ? "weekly-stat-active" : ""}`} onClick={() => setStatusFilter(statusFilter === key ? "all" : key)} aria-pressed={statusFilter === key}>
              <strong>{counts[key]}</strong>
              <span>{WEEKLY_LABELS[key]}</span>
            </button>))}
          <div className="weekly-stat weekly-stat-rate">
            <strong>
              {rows.length
            ? Math.round(((counts.on_time + counts.late) / rows.length) * 100)
            : 0}
              %
            </strong>
            <span>Taux de remise</span>
          </div>
        </div>
      </section>

      <section className="surface management-panel">
        <div className="panel-heading management-heading">
          <div>
            <span className="panel-kicker">ÉTUDIANTS CONCERNÉS</span>
            <h2>
              {weekLabel(week, false)}{" "}
              <span className="heading-count">{rows.length}</span>
            </h2>
          </div>
          <div className="toolbar">
            <select aria-label="Filtrer les bilans par cohorte" value={cohort} onChange={(event) => setCohort(event.target.value)}>
              <option value="all">Toutes les cohortes</option>
              {listCohorts(students).map((item) => (<option key={item} value={item}>
                  {cohortLabel(item)}
                </option>))}
            </select>
            <select aria-label="Filtrer les bilans par statut" value={statusFilter} onChange={(event) => setStatusFilter(event.target.value)}>
              <option value="all">Tous les statuts</option>
              <option value="on_time">Rendus à temps</option>
              <option value="late">Rendus en retard</option>
              <option value="pending">À rendre</option>
              <option value="missing">Non rendus</option>
            </select>
          </div>
        </div>
        <div className="table-scroll">
          <table className="data-table management-table weekly-table">
            <thead>
              <tr>
                <th>ÉTUDIANT</th>
                <th>COHORTE</th>
                <th>TEMPS DÉCLARÉ</th>
                <th>STATUT</th>
                <th>TRANSMIS LE</th>
                <th className="actions-heading">ACTIONS</th>
              </tr>
            </thead>
            <tbody>
              {visible.map(({ student, report, status }) => (<tr key={student.id}>
                  <td>
                    <div className="person-cell">
                      <Avatar name={student.name} small/>
                      <div>
                        <strong>{student.name}</strong>
                        <span className="cell-subtext">
                          {student.registration}
                        </span>
                      </div>
                    </div>
                  </td>
                  <td className="muted-cell">{cohortLabel(student.cohort)}</td>
                  <td className="table-time">
                    {report?.submittedAt
                ? formatDuration(report.hours, report.minutes)
                : "—"}
                  </td>
                  <td>
                    <WeeklyStatusBadge status={status}/>
                  </td>
                  <td className="muted-cell">
                    {report?.submittedAt
                ? new Intl.DateTimeFormat("fr-FR", {
                    weekday: "short",
                    day: "numeric",
                    month: "short",
                    hour: "2-digit",
                    minute: "2-digit",
                }).format(new Date(report.submittedAt))
                : "—"}
                  </td>
                  <td>
                    <div className="table-actions">
                      {report?.submittedAt ? (<>
                          {!report.reviewedAt && (<span className="new-report-text">Nouveau</span>)}
                          <button type="button" className={`button button-table button-view ${report.reviewedAt ? "" : "button-view-new"}`} onClick={() => onInspect(report.id)}>
                            <Icon name="eye" size={15}/>
                            {report.reviewedAt ? "Revoir" : "Inspecter"}
                          </button>
                        </>) : (<button type="button" className="button button-table button-whatsapp" onClick={() => onRemind(student, week)}>
                          <Icon name="send" size={15}/>
                          {status === "missing"
                    ? "Relancer (retard)"
                    : "Rappel échéance"}
                        </button>)}
                    </div>
                  </td>
                </tr>))}
            </tbody>
          </table>
          {visible.length === 0 && (<EmptyState icon="calendar" title="Aucun bilan à afficher" text={rows.length
                ? "Aucun étudiant ne correspond à ce filtre pour cette semaine."
                : "Aucun étudiant n'était inscrit sur cette semaine."}/>)}
        </div>
      </section>
    </>);
}

        return true;
    }
    function inspectWeekly(reportId) {
        setData((current) => ({
            ...current,
            weeklyReports: current.weeklyReports.map((item) => item.id === reportId
                ? { ...item, reviewedAt: item.reviewedAt || new Date().toISOString() }
                : item),
        }));
        setModal({ type: "inspectWeekly", reportId });
    }
    /** Rappel WhatsApp du bilan hebdomadaire (échéance à venir ou dépassée). */
    function remindWeekly(student, weekStart) {
        const portal = resolvePortalUrl(data.settings);
        const overdue = Date.now() > weekDeadline(weekStart).getTime();
        const message = [
            `Bonjour ${student.name},`,
            "",
            overdue
                ? `Votre formateur JZ KALYPHOR constate que votre bilan hebdomadaire de la ${weekLabel(weekStart).toLowerCase()} n'a pas été transmis avant l'échéance (${formatDeadline(weekStart)}).`
                : `Rappel : votre bilan hebdomadaire de la ${weekLabel(weekStart).toLowerCase()} est à transmettre avant le ${formatDeadline(weekStart)}.`,
            overdue
                ? "Merci de le rendre dès que possible depuis votre espace : il sera enregistré comme rendu en retard."
                : "Pensez à indiquer votre temps d'étude, les cours travaillés, votre compte-rendu et vos objectifs.",
            "",
            `Votre espace étudiant : ${portal}`,
            `Immatriculation : ${student.registration}`,
            "",
            "Votre formateur – JZ KALYPHOR",
        ].join("\n");
        openWhatsApp(student, message);
        notify(overdue
            ? `Relance de bilan en retard préparée pour ${student.name}.`
            : `Rappel d'échéance préparé pour ${student.name}.`, "info");
    }
    function inspectReport(studentId, courseId) {
        updateProgress(studentId, courseId, (current) => ({
            ...current,
            reviewedAt: current.reviewedAt || new Date().toISOString(),
        }));
        setModal({ type: "inspect", studentId, courseId });
    }
    function startTour(kind) {
        setHelpOpen(false);
        setModal(null);
        setTour(kind);
    }
    function finishTour() {
        if (tour === "admin")
            setGuide((g) => ({ ...g, adminTourDone: true }));
        if (tour === "student" && currentStudent)
            setGuide((g) => ({
                ...g,
                studentTourDone: { ...g.studentTourDone, [currentStudent.id]: true },
            }));
        if (tour === "course" && currentStudent)
            setGuide((g) => ({
                ...g,
                courseTourDone: { ...g.courseTourDone, [currentStudent.id]: true },
            }));
        setTour(null);
        setMobileNavOpen(false);
    }
    const handleTourStep = useCallback((step) => {
        setMobileNavOpen(!!step.requiresNav);
    }, []);
    // Première visite : la visite guidée se lance automatiquement, une seule fois par espace.
    useEffect(() => {
        if (!session || modal || tour)
            return;
        if (session.role === "admin" &&
            !guide.adminTourDone &&
            adminView === "overview") {
            const timer = window.setTimeout(() => setTour("admin"), 700);
            return () => window.clearTimeout(timer);
        }
        if (session.role === "student" && currentStudent) {
            if (studentView === "courses" &&
                !guide.studentTourDone[currentStudent.id]) {
                const timer = window.setTimeout(() => setTour("student"), 700);
                return () => window.clearTimeout(timer);
            }
            if (studentView === "course" &&
                !guide.courseTourDone[currentStudent.id]) {
                const timer = window.setTimeout(() => setTour("course"), 700);
                return () => window.clearTimeout(timer);
            }
        }
        return undefined;
        // eslint-disable-next-line react-hooks/exhaustive-deps
    }, [session, adminView, studentView, currentStudent?.id, guide, modal, tour]);
    /**
     * Notification d'un nouveau cours. Seul le lien de l'espace étudiant JZ KALYPHOR
     * est communiqué : l'URL de la plateforme externe n'est jamais transmise par
     * message, l'étudiant la découvre en cliquant sur le bouton d'accès dans son cours.
     */
    function shareCourse(student, course) {
        const portal = resolvePortalUrl(data.settings);
        const message = [
            `Bonjour ${student.name},`,
            "",
            `Un nouveau cours vous attend dans votre espace JZ KALYPHOR : « ${course.title} ».`,
            "",
            portal
                ? `Connectez-vous ici : ${portal}`
                : "Connectez-vous à votre espace étudiant.",
            `Nom complet : ${student.name}`,
            `Immatriculation : ${student.registration}`,
            "",
            "Ouvrez le cours depuis votre espace pour accéder à la ressource, déclarer votre temps d'étude et transmettre votre compte-rendu.",
            "",
            "Votre formateur – JZ KALYPHOR",
        ].join("\n");
        openWhatsApp(student, message);
        notify(`Notification du cours envoyée à ${student.name}.`, "info");
    }
    function remindStudent(student) {
        const pending = assignments.find((item) => item.student.id === student.id &&
            item.progress.status === "in_progress") ||
            assignments.find((item) => item.student.id === student.id &&
                item.progress.status === "not_started");
        const portal = resolvePortalUrl(data.settings);
        const footer = portal
            ? `\n\nVotre espace étudiant : ${portal}\nImmatriculation : ${student.registration}`
            : `\n\nImmatriculation : ${student.registration}`;
        const message = !student.active
            ? `Bonjour ${student.name}, votre accès à la plateforme JZ KALYPHOR est actuellement suspendu. Merci de prendre contact avec votre formateur pour faire le point sur votre parcours et rétablir votre accès.`
            : pending
                ? `Bonjour ${student.name}, votre formateur JZ KALYPHOR constate que le rapport pour le cours « ${pending.course.title} » n'a pas encore été rendu. Merci de finaliser votre temps d'étude, votre compte-rendu et vos preuves dès que possible. Nous restons disponibles si vous avez besoin d'aide.${footer}`
                : `Bonjour ${student.name}, félicitations pour votre progression sur JZ KALYPHOR. Continuez à consulter votre espace pour découvrir vos prochaines ressources. Votre formateur reste à votre écoute.${footer}`;
        openWhatsApp(student, message);
        notify(`Relance WhatsApp préparée pour ${student.name}.`, "info");
    }
    function openStudentCourse(courseId) {
        if (!currentStudent)
            return;
        updateProgress(currentStudent.id, courseId, (progress) => ({
            ...progress,
            status: progress.status === "not_started" ? "in_progress" : progress.status,
        }));
        setSelectedCourseId(courseId);
        setStudentView("course");
        window.scrollTo({ top: 0, behavior: "smooth" });
    }
    function submitReport() {
        if (!currentStudent || !currentCourse)
            return;
        const progress = getProgress(data, currentStudent.id, currentCourse.id);
        const timerElapsed = progress.timerSeconds +
            (progress.timerStartedAt
                ? Math.max(0, Math.floor((Date.now() - progress.timerStartedAt) / 1000))
                : 0);
        const totalMinutes = progress.hours * 60 +
            progress.minutes +
            (timerElapsed ? Math.ceil(timerElapsed / 60) : 0);
        if (totalMinutes < 1) {
            notify("Indiquez au moins une minute d'étude avant l'envoi.", "error");
            return;
        }
        if (progress.report.trim().length < 20) {
            notify("Rédigez un compte-rendu d'au moins 20 caractères.", "error");
            return;
        }
        if (!progress.proofs.length) {
            notify("Ajoutez au moins une capture ou un PDF comme preuve.", "error");
            return;
        }
        updateProgress(currentStudent.id, currentCourse.id, (current) => ({
            ...current,
            hours: Math.floor(totalMinutes / 60),
            minutes: totalMinutes % 60,
            timerSeconds: 0,
            timerStartedAt: undefined,
            report: current.report.trim(),
            status: "submitted",
            submittedAt: new Date().toISOString(),
        }));
        notify("Votre rapport et vos preuves ont été transmis au formateur.");
    }
    function confirmAction() {
        if (!modal)
            return;
        if (modal.type === "deleteStudent") {
            const student = data.students.find((item) => item.id === modal.id);
            setData((current) => ({
                ...current,
                students: current.students.filter((item) => item.id !== modal.id),
                progress: current.progress.filter((item) => item.studentId !== modal.id),
                weeklyReports: current.weeklyReports.filter((item) => item.studentId !== modal.id),
                courses: current.courses
                    .filter((item) => item.target !== modal.id)
                    .map((item) => {
                    if (!item.externalCredentials?.[modal.id])
                        return item;
                    const credentials = { ...item.externalCredentials };
                    delete credentials[modal.id];
                    return { ...item, externalCredentials: credentials };
                }),
            }));
            notify(`${student?.name || "L'étudiant"} et ses données ont été supprimés.`, "info");
        }
        else if (modal.type === "deleteCourse") {
            const course = data.courses.find((item) => item.id === modal.id);
            setData((current) => ({
                ...current,
                courses: current.courses.filter((item) => item.id !== modal.id),
                progress: current.progress.filter((item) => item.courseId !== modal.id),
            }));
            notify(`Le cours « ${course?.title || "sélectionné"} » a été supprimé.`, "info");
        }
        else if (modal.type === "reset") {
            setData(seedData());
            setSession(null);
            setAdminView("overview");
            setStudentView("courses");
            setSelectedCourseId(null);
            notify("Les données initiales de la plateforme ont été restaurées.");
        }
        setModal(null);
    }
    function renderModal() {
        if (!modal)
            return null;
        if (modal.type === "studentForm")
            return (<StudentFormModal students={data.students} onClose={() => setModal(null)} onSave={saveStudent}/>);
        if (modal.type === "courseForm")
            return (<CourseFormModal students={data.students} onClose={() => setModal(null)} onSave={saveCourse}/>);
        if (modal.type === "externalCredentials") {
            const course = data.courses.find((item) => item.id === modal.courseId);
            return course ? (<ExternalCredentialsModal course={course} students={data.students} onClose={() => setModal(null)} onSave={saveExternalCredentials}/>) : null;
        }
        if (modal.type === "inspect") {
            const assignment = assignments.find((item) => item.student.id === modal.studentId &&
                item.course.id === modal.courseId);
            return assignment ? (<InspectModal assignment={assignment} onClose={() => setModal(null)}/>) : null;
        }
        if (modal.type === "inspectWeekly") {
            const report = data.weeklyReports.find((item) => item.id === modal.reportId);
            const student = report && data.students.find((item) => item.id === report.studentId);
            return report && student ? (<WeeklyInspectModal report={report} student={student} courses={data.courses} onClose={() => setModal(null)}/>) : null;
        }
        if (modal.type === "deleteStudent")
            return (<ConfirmModal eyebrow="SUPPRESSION DÉFINITIVE" title="Supprimer cet étudiant ?" text="Son compte, ses rapports et ses preuves seront supprimés. Les cours qui lui sont exclusivement attribués seront également retirés." confirmLabel="Supprimer l'étudiant" dangerous onClose={() => setModal(null)} onConfirm={confirmAction}/>);
        if (modal.type === "deleteCourse")
            return (<ConfirmModal eyebrow="SUPPRESSION DÉFINITIVE" title="Supprimer ce cours ?" text="Ce cours ainsi que les temps d'étude, comptes-rendus et preuves associés seront définitivement supprimés." confirmLabel="Supprimer le cours" dangerous onClose={() => setModal(null)} onConfirm={confirmAction}/>);
        return (<ConfirmModal eyebrow="MAINTENANCE DE LA PLATEFORME" title="Restaurer les données initiales ?" text="Tous les étudiants, cours, accès externes, temps d'étude et fichiers enregistrés sur cet appareil seront effacés, puis la configuration initiale sera restaurée. Cette action est irréversible." confirmLabel="Restaurer les données initiales" onClose={() => setModal(null)} onConfirm={confirmAction}/>);
    }
    if (!session || (session.role === "student" && !currentStudent?.active))
        return (<>
        <LoginScreen onLogin={login}/>
        {renderModal()}
        <ToastStack toasts={toasts} dismiss={(id) => setToasts((current) => current.filter((item) => item.id !== id))}/>
      </>);
    const isAdmin = session.role === "admin";
    const view = isAdmin ? adminView : studentView;
    const pageTitle = isAdmin
        ? {
            overview: "Vue d'ensemble",
            students: "Étudiants",
            courses: "Cours & ressources",
            tracking: "Suivi & rapports",
            weekly: "Bilans hebdomadaires",
        }[adminView]
        : studentView === "weekly"
            ? "Bilan hebdomadaire"
            : studentView === "progress"
                ? "Mon parcours"
                : studentView === "course"
                    ? "Mon cours"
                    : "Mes cours";
    const displayName = isAdmin ? ADMIN_NAME : currentStudent.name;
    const pendingCourseReviews = assignments.filter((item) => item.progress.status === "submitted" && !item.progress.reviewedAt).length;
    const pendingWeeklyReviews = data.weeklyReports.filter((item) => item.submittedAt && !item.reviewedAt).length;
    const pendingReviews = pendingCourseReviews + pendingWeeklyReviews;
    const currentWeek = weekKeyOf(new Date(now));
    const studentWeeklyReports = currentStudent
        ? data.weeklyReports.filter((item) => item.studentId === currentStudent.id)
        : [];
    const studentCurrentReport = studentWeeklyReports.find((item) => item.weekStart === currentWeek);
    const studentMissedWeeks = currentStudent
        ? studentWeeks(currentStudent, now).filter((week) => weeklyStatus(studentWeeklyReports.find((item) => item.weekStart === week), week, now) === "missing").length
        : 0;
    const sidebarBadges = isAdmin
        ? {
            ...(pendingCourseReviews ? { tracking: pendingCourseReviews } : {}),
            ...(pendingWeeklyReviews ? { weekly: pendingWeeklyReviews } : {}),
        }
        : weeklyStatus(studentCurrentReport, currentWeek, now) === "pending"
            ? { weekly: "!" }
            : {};
    const checklistItems = [
        {
            id: "student",
            label: "Inscrire un premier étudiant",
            hint: "Nom, WhatsApp et mois d'adhésion : l'immatriculation est générée pour vous.",
            done: data.students.length > 0,
            actionLabel: "Ajouter",
            onAction: () => setModal({ type: "studentForm" }),
        },
        {
            id: "access",
            label: "Envoyer les accès à chaque étudiant",
            hint: "Un clic ouvre WhatsApp avec l'immatriculation et le lien de l'espace étudiant.",
            done: data.students.length > 0 &&
                data.students.every((student) => student.accessSentAt),
            actionLabel: "Voir les étudiants",
            onAction: () => setAdminView("students"),
        },
        {
            id: "course",
            label: "Publier un premier cours",
            hint: "Vidéo, plateforme ou document, diffusé à tous, à une cohorte ou à une personne.",
            done: data.courses.length > 0,
            actionLabel: "Publier",
            onAction: () => setModal({ type: "courseForm" }),
        },
        {
            id: "review",
            label: "Inspecter un rapport transmis",
            hint: "Temps déclaré, compte-rendu et preuves de visionnage, au même endroit.",
            done: data.progress.some((item) => item.reviewedAt),
            actionLabel: "Ouvrir le suivi",
            onAction: () => {
                setTrackingFilter("submitted");
                setAdminView("tracking");
            },
        },
    ];
    const tourSteps = tour === "admin"
        ? ADMIN_TOUR
        : tour === "student"
            ? STUDENT_TOUR
            : COURSE_TOUR;
    return (<div className="app-shell">
      <Sidebar role={isAdmin ? "admin" : "student"} activeView={view} studentName={currentStudent?.name} studentRegistration={currentStudent?.registration} onNavigate={(next) => {
            if (isAdmin)
                setAdminView(next);
            else
                setStudentView(next);
            window.scrollTo({ top: 0, behavior: "smooth" });
        }} onLogout={logout} open={mobileNavOpen} onClose={() => setMobileNavOpen(false)} badges={sidebarBadges}/>
      <main className="workspace">
        <Topbar title={pageTitle} role={isAdmin ? "admin" : "student"} name={displayName} onMenu={() => setMobileNavOpen(true)} onHelp={() => setHelpOpen(true)} pendingReviews={isAdmin ? pendingReviews : 0} onPendingClick={() => {
            if (pendingCourseReviews) {
                setTrackingFilter("submitted");
                setAdminView("tracking");
            }
            else {
                setAdminView("weekly");
            }
            window.scrollTo({ top: 0, behavior: "smooth" });
        }}/>
        <div className="workspace-content" key={view}>
          {isAdmin && adminView === "overview" && (<AdminOverview assignments={assignments} studentsCount={data.students.length} cohortsCount={listCohorts(data.students).length} coursesCount={data.courses.length} onNavigate={setAdminView} onInspect={inspectReport} onCreateCourse={() => setModal({ type: "courseForm" })} weeklyBanner={<AdminWeeklyBanner students={data.students} reports={data.weeklyReports} now={now} onOpen={() => setAdminView("weekly")}/>} checklist={!guide.checklistHidden && (<OnboardingChecklist items={checklistItems} onHide={() => setGuide((g) => ({ ...g, checklistHidden: true }))}/>)}/>)}
          {isAdmin && adminView === "students" && (<AdminStudents students={data.students} assignments={assignments} portalUrl={data.settings.portalUrl} cohortFilter={cohortFilter} setCohortFilter={setCohortFilter} onSendAccess={sendAccess} onSavePortalUrl={savePortalUrl} query={studentQuery} setQuery={setStudentQuery} filter={studentFilter} setFilter={setStudentFilter} onAdd={() => setModal({ type: "studentForm" })} onToggle={toggleStudent} onDelete={(student) => setModal({ type: "deleteStudent", id: student.id })} onRemind={remindStudent}/>)}
          {isAdmin && adminView === "courses" && (<AdminCourses courses={data.courses} students={data.students} assignments={assignments} onAdd={() => setModal({ type: "courseForm" })} onCredentials={(course) => setModal({ type: "externalCredentials", courseId: course.id })} onDelete={(course) => setModal({ type: "deleteCourse", id: course.id })}/>)}
          {isAdmin && adminView === "tracking" && (<AdminTracking assignments={assignments} query={trackingQuery} setQuery={setTrackingQuery} filter={trackingFilter} setFilter={setTrackingFilter} onInspect={inspectReport} onShare={shareCourse}/>)}
          {isAdmin && adminView === "weekly" && (<AdminWeekly students={data.students} reports={data.weeklyReports} now={now} onInspect={inspectWeekly} onRemind={remindWeekly}/>)}
          {!isAdmin && currentStudent && studentView === "courses" && (<StudentHome student={currentStudent} assignments={studentAssignments} onOpen={openStudentCourse} weeklyBanner={<WeeklyDeadlineBanner report={studentCurrentReport} missedCount={studentMissedWeeks} now={now} onOpen={() => {
                    setStudentView("weekly");
                    window.scrollTo({ top: 0, behavior: "smooth" });
                }}/>}/>)}
          {!isAdmin && currentStudent && studentView === "weekly" && (<StudentWeekly student={currentStudent} courses={studentAssignments.map((item) => item.course)} reports={studentWeeklyReports} now={now} onUpdate={(weekStart, updater) => updateWeekly(currentStudent.id, weekStart, updater)} onSubmit={submitWeekly} onNotify={notify}/>)}
          {!isAdmin && currentStudent && studentView === "progress" && (<StudentProgress assignments={studentAssignments} onOpen={openStudentCourse}/>)}
          {!isAdmin &&
            currentStudent &&
            studentView === "course" &&
            currentCourse && (<StudentCourse key={currentCourse.id} course={currentCourse} progress={getProgress(data, currentStudent.id, currentCourse.id)} studentId={currentStudent.id} onBack={() => setStudentView("courses")} onUpdate={updateProgress} onSubmit={submitReport} onNotify={notify} dataSize={JSON.stringify(data).length}/>)}
        </div>
        <footer className="workspace-footer">
          <span>
            © {new Date().getFullYear()} JZ KALYPHOR · Votre avenir, votre
            trajectoire.
          </span>
          {isAdmin && (<button type="button" className="footer-maintenance" onClick={() => setModal({ type: "reset" })}>
              <Icon name="reset" size={12}/>
              Restaurer les données initiales
            </button>)}
        </footer>
      </main>
      {renderModal()}
      {helpOpen && (<HelpPanel role={isAdmin ? "admin" : "student"} onClose={() => setHelpOpen(false)} onStartTour={() => {
                if (isAdmin) {
                    setAdminView("overview");
                    startTour("admin");
                }
                else if (studentView === "course") {
                    startTour("course");
                }
                else {
                    setStudentView("courses");
                    startTour("student");
                }
            }}/>)}
      {tour && (<GuidedTour steps={tourSteps} onStep={handleTourStep} onClose={finishTour}/>)}
      <ToastStack toasts={toasts} dismiss={(id) => setToasts((current) => current.filter((item) => item.id !== id))}/>
    </div>);
}

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
